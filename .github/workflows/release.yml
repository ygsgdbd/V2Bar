name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag; dispatch with the same tag ref via CLI or API
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: Build and Release
    runs-on: macos-26
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error title=Invalid release tag::Expected vX.Y.Z or vX.Y.Z-suffix, got ${RELEASE_TAG}."
            exit 1
          fi

          if ! TAG_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null); then
            echo "::error title=Invalid release tag::Tag ${RELEASE_TAG} does not exist or does not resolve to a commit."
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "::error title=Lightweight tags are not supported::Create ${RELEASE_TAG} with git tag -a."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
              echo "::error title=Invalid manual release ref::Run: gh workflow run release.yml --ref ${RELEASE_TAG} -f release_tag=${RELEASE_TAG}"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
              echo "::error title=Invalid tag push ref::Expected tag ref ${RELEASE_TAG}, got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
              exit 1
            fi
          else
            echo "::error title=Unsupported release event::Expected push or workflow_dispatch, got ${GITHUB_EVENT_NAME}."
            exit 1
          fi

          if [[ "$GITHUB_SHA" != "$TAG_COMMIT" ]]; then
            echo "::error title=Release source mismatch::Event commit ${GITHUB_SHA} does not match tag ${RELEASE_TAG} commit ${TAG_COMMIT}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error title=Release commit is not on main::Tag ${RELEASE_TAG} must point to a commit contained in origin/main."
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$TAG_COMMIT"
            echo "prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout validated release commit
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git checkout --detach "$RELEASE_COMMIT"
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "$HEAD_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Release checkout mismatch::Checked out ${HEAD_COMMIT}, expected ${RELEASE_COMMIT}."
            exit 1
          fi

      - name: Validate release secrets
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error title=Missing Sparkle signing key::Set SPARKLE_ED_PRIVATE_KEY before publishing."; exit 1; }
          if [[ "$IS_PRERELEASE" != "true" ]]; then
            test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error title=Missing Homebrew token::Set HOMEBREW_TAP_TOKEN before publishing a stable release."; exit 1; }
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode Project
        env:
          TUIST_APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          TUIST_BUILD_VERSION=$(date -u "+%Y%m%d%H%M")
          export TUIST_BUILD_VERSION
          echo "App version set to: $TUIST_APP_VERSION"
          echo "Build number set to: $TUIST_BUILD_VERSION"
          tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -workspace V2Bar.xcworkspace \
            -scheme V2Bar \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive App
        run: |
          xcodebuild \
            -workspace V2Bar.xcworkspace \
            -scheme V2Bar \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ./DerivedData/Archives/V2Bar.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Verify Universal Binary
        run: |
          BINARY_PATH="DerivedData/Archives/V2Bar.xcarchive/Products/Applications/V2Bar.app/Contents/MacOS/V2Bar"
          ARCHS=$(lipo -archs "$BINARY_PATH")
          echo "V2Bar architectures: $ARCHS"
          if [[ " $ARCHS " != *" arm64 "* || " $ARCHS " != *" x86_64 "* ]]; then
            echo "::error title=Invalid binary architectures::Expected arm64 and x86_64, got: $ARCHS"
            exit 1
          fi

      - name: Package App
        run: |
          mkdir -p DerivedData/Exports
          ditto DerivedData/Archives/V2Bar.xcarchive/Products/Applications/V2Bar.app DerivedData/Exports/V2Bar.app
          cd DerivedData/Exports
          ditto -c -k --sequesterRsrc --keepParent V2Bar.app ../../V2Bar-macOS-universal.zip

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! awk -v version="$RELEASE_TAG" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { lines[++count] = $0 }
            END {
              if (!found) exit 2
              start = 1
              while (start <= count && lines[start] ~ /^[[:space:]]*$/) start++
              end = count
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              if (end < start) exit 3
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error title=Missing release notes::CHANGELOG.md must contain a non-empty ## ${RELEASE_TAG} section."
            exit 1
          fi

      - name: Render Sparkle release notes HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api markdown \
            --method POST \
            -F text=@release-notes.md \
            -f mode=gfm \
            -f context="${GITHUB_REPOSITORY}" \
            > release-notes.html
          test -s release-notes.html

      - name: Generate Checksums
        run: |
          {
            echo "### SHA-256 Checksums"
            echo '```'
            shasum -a 256 V2Bar-macOS-universal.zip
            echo '```'
          } > checksums.txt

          {
            echo "## V2Bar ${{ steps.release.outputs.tag }}"
            echo ""
            cat release-notes.md
            echo ""
            echo "### Build"
            echo ""
            echo "- Universal Binary (Apple Silicon + Intel)"
            echo "- macOS 14.0+"
            echo ""
            cat checksums.txt
          } > release-body.md

      - name: Download Sparkle tools
        run: |
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            -o Sparkle-2.9.4.tar.xz
          echo "ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9  Sparkle-2.9.4.tar.xz" \
            | shasum -a 256 --check
          mkdir -p sparkle-tools
          tar -xf Sparkle-2.9.4.tar.xz -C sparkle-tools --strip-components=1

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p DerivedData/SparkleFeed
          cp V2Bar-macOS-universal.zip DerivedData/SparkleFeed/
          cp release-notes.html DerivedData/SparkleFeed/V2Bar-macOS-universal.html
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ygsgdbd/V2Bar/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/ygsgdbd/V2Bar" \
            --embed-release-notes \
            --maximum-versions 1 \
            DerivedData/SparkleFeed
          cp DerivedData/SparkleFeed/appcast.xml appcast.xml
          test -s appcast.xml

      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: V2Bar-macOS-universal.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            V2Bar-macOS-universal.zip
            appcast.xml
            checksums.txt
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          tag_name: ${{ steps.release.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Homebrew tap
        if: steps.release.outputs.prerelease != 'true'
        uses: actions/checkout@v4
        with:
          repository: ygsgdbd/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Cask
        if: steps.release.outputs.prerelease != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 V2Bar-macOS-universal.zip | awk '{print $1}')
          CASK_PATH="homebrew-tap/Casks/v2bar.rb"
          export CASK_PATH RELEASE_TAG SHA256 VERSION

          ruby <<'RUBY'
          path = ENV.fetch("CASK_PATH")
          content = File.read(path)
          replacements = {
            /^  version ".*"$/ => "  version \"#{ENV.fetch("VERSION")}\"",
            /^  sha256 ".*"$/ => "  sha256 \"#{ENV.fetch("SHA256")}\"",
            /^  url ".*"$/ => "  url \"https://github.com/ygsgdbd/V2Bar/releases/download/#{ENV.fetch("RELEASE_TAG")}/V2Bar-macOS-universal.zip\"",
            /^  depends_on macos:.*$/ => "  depends_on macos: :sonoma",
          }

          replacements.each do |pattern, replacement|
            matches = content.scan(pattern).length
            abort "Expected exactly one #{pattern.inspect} entry in #{path}, found #{matches}" unless matches == 1
            content.sub!(pattern, replacement)
          end

          File.write(path, content)
          RUBY

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/v2bar.rb
          if git diff --cached --quiet; then
            echo "Homebrew Cask is already up to date."
            exit 0
          fi
          git commit -m "chore: update V2Bar Cask to ${RELEASE_TAG}"
          git push
